name: footcoach

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-footcoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-in-prod}
      POSTGRES_DB: ${POSTGRES_DB:-footcoach}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 côté hôte pour ne pas entrer en conflit avec un postgres local.
      #
      # L'adresse 127.0.0.1 n'est pas décorative : sans elle, Docker publie sur
      # 0.0.0.0, et la base de développement — dont le mot de passe par défaut
      # est écrit dans ce fichier — devient joignable par tout le monde sur le
      # réseau du bureau, du coworking ou du Wi-Fi partagé. Lecture complète,
      # empreintes bcrypt et adresses des comptes de test comprises.
      #
      # Le développement hors Docker continue de fonctionner : il se connecte
      # depuis la machine hôte, donc par la boucle locale.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-footcoach} -d ${POSTGRES_DB:-footcoach}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - footcoach

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-footcoach}:${POSTGRES_PASSWORD:-changeme-in-prod}@postgres:5432/${POSTGRES_DB:-footcoach}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-not-for-prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-not-for-prod}
      API_PORT: 4000
      # Web Push — aucune valeur par défaut : une clé privée n'a rien à faire
      # dans un fichier versionné. La paire vit dans .env (ignoré par git),
      # à générer avec `npx web-push generate-vapid-keys`.
      # Sans ces variables l'API démarre normalement et le réglage des
      # notifications explique de lui-même pourquoi il est indisponible.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@footcoach.local}
      # Annuaire public des entreprises, pour suggérer un nom de club à
      # l'inscription. Une adresse injoignable dégrade la suggestion sans rien
      # casser — la saisie du nom reste libre.
      CLUB_DIRECTORY_URL: ${CLUB_DIRECTORY_URL:-https://recherche-entreprises.api.gouv.fr}
      # Lève les plafonds de débit pour la simulation de charge, qui joue cent
      # coachs depuis une seule adresse. Refusé si NODE_ENV=production.
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-}
      # Sauts de confiance pour établir l'adresse des clients. Vide = ne croire
      # personne, ce qui est le bon réglage sans reverse proxy en façade : Next
      # relaie X-Forwarded-For tel quel, il ne peut donc pas en attester.
      TRUST_PROXY: ${TRUST_PROXY:-}
    # Pas de port hôte : l'API n'est accessible que via le proxy Next (service web).
    # Cela permet `docker compose up --scale api=3` sans conflit de ports.
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/drizzle:/app/apps/api/drizzle
      - ./packages/shared/src:/app/packages/shared/src
      # Photos de profil : persistées hors de l'image, à sauvegarder comme la base
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - footcoach

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      API_INTERNAL_URL: http://api:4000
      # Racine des canoniques, du plan du site et des données structurées. Lue
      # au DÉMARRAGE (pas de préfixe NEXT_PUBLIC_, qui serait figé au build) :
      # changer de domaine ne demande qu'un redémarrage du conteneur.
      SITE_URL: ${SITE_URL:-https://teamnexus.fr}
    ports:
      # 3002 côté hôte : 3000 et 3001 sont occupés par d'autres projets locaux
      - "3002:3000"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      # Service worker des notifications : servi tel quel par Next à la racine
      - ./apps/web/public:/app/apps/web/public
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      - api
    networks:
      - footcoach

volumes:
  pgdata:
  uploads:

networks:
  footcoach:
    driver: bridge
