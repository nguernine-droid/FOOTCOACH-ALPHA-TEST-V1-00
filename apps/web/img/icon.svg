<?xml version="1.0" encoding="UTF-8"?>
<!--
  SOURCE des icônes PWA — direction « Tableau noir ».

  Ce fichier est le maître : `icon.png` et `apple-icon.png` en sont rasterisés
  (voir README.md). Il reprend le dessin de `src/components/Logo.tsx`, avec
  deux différences imposées par le format :

  1. COULEURS LITTÉRALES. Le composant peint en jetons CSS ; un SVG rasterisé
     hors du navigateur n'a aucune feuille de style à interroger. Ces valeurs
     doivent rester alignées sur `tokens.css`.
     (Pas de double tiret dans ce commentaire : XML l'interdit, et librsvg
     refuse le fichier entier — d'où les noms de jetons écrits en toutes
     lettres plutôt qu'avec leur préfixe.)

  2. TUILE À FOND PERDU, sans coins arrondis. Les systèmes appliquent leur
     propre masque — cercle sur Android, squircle sur iOS — et un coin arrondi
     dessiné se verrait comme un liseré à l'intérieur du masque.

  La marque occupe 62 % du côté : elle tient donc dans la zone de sécurité
  `maskable` (le cercle intérieur de 80 %), quel que soit le rognage.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#D8F24A"/>
  <g transform="translate(97.28 97.28) scale(9.92)">
    <!-- Le joueur -->
    <circle cx="10.5" cy="21.5" r="3.1" fill="#16181C"/>
    <!-- Sa course, et la pointe qui dit où il va -->
    <g fill="none" stroke="#16181C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.9 19.6C17 15.6 19.4 12.9 22.6 11"/>
      <path d="M19.4 10.9L23.1 10.2L23 13.9"/>
    </g>
  </g>
</svg>
