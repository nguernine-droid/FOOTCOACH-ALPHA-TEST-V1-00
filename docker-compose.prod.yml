# Overrides production : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Scalabilité : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale api=3
name: footcoach

services:
  postgres:
    restart: unless-stopped
    ports: []
    # `?` : compose refuse de démarrer si la variable est absente ou vide.
    # Le mot de passe par défaut du fichier de développement n'a rien à faire
    # sur une base exposée.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définissez POSTGRES_PASSWORD dans .env}

  api:
    build:
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Secrets obligatoires : sans eux la pile ne démarre pas. Les générer une
      # fois avec `openssl rand -base64 48`, distincts l'un de l'autre.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?générez un secret dédié (openssl rand -base64 48)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?générez un secret dédié, distinct du précédent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définissez POSTGRES_PASSWORD dans .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-footcoach}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-footcoach}
      # Origines autorisées à appeler l'API depuis un navigateur. Vide = aucune,
      # ce qui suffit puisque le navigateur passe par le proxy du service web.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Sauts de confiance pour établir l'adresse des clients, donc leur compteur
      # de débit. À renseigner UNIQUEMENT derrière un reverse proxy qui complète
      # X-Forwarded-For (`$$proxy_add_x_forwarded_for` chez nginx) : Next relaie
      # cet en-tête tel quel et ne peut pas en attester. Réglage attendu avec un
      # reverse proxy dans le réseau Docker : loopback,uniquelocal
      TRUST_PROXY: ${TRUST_PROXY:-}
    # `!override` REMPLACE la liste du fichier de base au lieu de la fusionner —
    # comportement par défaut de compose sur les séquences. Sans cette balise,
    # les bind mounts de rechargement à chaud du fichier de base survivraient et
    # l'image de production servirait le code source de l'hôte.
    #
    # Ce qu'il faut retirer, ce sont ces bind mounts ; PAS le volume des photos
    # de profil, qui doit survivre aux reconstructions d'image. Une liste vide
    # emportait les deux : les avatars disparaissaient à chaque déploiement,
    # alors que le README demande de sauvegarder ce volume comme la base.
    volumes: !override
      - uploads:/app/uploads

  web:
    build:
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
    volumes: []
